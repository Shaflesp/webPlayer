server.port=8080
spring.threads.virtual.enabled=true
spring.mvc.async.request-timeout=-1

# SPA fallback
spring.web.resources.static-locations=classpath:/static/
spring.mvc.static-path-pattern=/**

# Suppress broken-pipe / client-disconnect noise on SSE endpoints.
# These are normal (browser tab closed, panel closed mid-stream) and not
# application errors.
#
# org.apache.catalina alone (broad, package-level) is needed because Tomcat
# logs uncaught servlet exceptions under a DYNAMICALLY NAMED logger per
# context/servlet — e.g. org.apache.catalina.core.ContainerBase.[Catalina].
# [localhost].[/].[dispatcherServlet] — which the narrower entries below
# don't match. Logback applies the level of the nearest ancestor package
# logger to any such dynamically-named child, so the broad entry catches it.
logging.level.org.apache.catalina=WARN
logging.level.org.springframework.web.servlet.mvc.method.annotation.ResponseBodyEmitterReturnValueHandler=WARN
logging.level.org.apache.coyote.http11=WARN