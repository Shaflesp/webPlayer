<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebPlayer — MPD</title>
    <link rel="icon" href="images/logo.png" type="image/png">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<!-- ─── Sidebar ─────────────────────────────────────────────────── -->
<aside class="sidebar">
    <div class="sidebar-header">
        <div class="brand">
            <img src="images/logo.png" alt="" class="brand-logo" onerror="this.style.display='none'">
            <span>WebPlayer</span>
            <button class="icon-btn" style="margin-left:auto" onclick="openSettings()" data-tip="Settings">
                <i class="fas fa-gear"></i>
            </button>
        </div>
        <div class="tab-bar">
            <button class="tab active" data-tab="queue"   onclick="switchTab('queue')">
                <i class="fas fa-list-ul"></i> Queue
            </button>
            <button class="tab"        data-tab="library" onclick="switchTab('library')">
                <i class="fas fa-folder-open"></i> Library
            </button>
            <button class="tab"        data-tab="search"  onclick="switchTab('search')">
                <i class="fas fa-magnifying-glass"></i> Search
            </button>
        </div>
    </div>

    <!-- Queue tab -->
    <div id="tab-queue" class="tab-content active">
        <div class="tab-toolbar">
            <span class="toolbar-label" id="queue-count">Queue</span>
            <button class="icon-btn" data-tip="Clear queue"
                    onclick="sendCommand('clear').then(() => fetchQueue())">
                <i class="fas fa-trash-can"></i>
            </button>
        </div>
        <div class="scroll-list" id="queue-list"></div>
    </div>

    <!-- Library tab -->
    <div id="tab-library" class="tab-content">
        <div class="tab-toolbar">
            <button class="icon-btn" id="browse-back" onclick="browseBack()" data-tip="Go back" style="display:none">
                <i class="fas fa-arrow-left"></i>
            </button>
            <span class="toolbar-label" id="browse-path">Library</span>
            <button class="icon-btn" id="browse-add-all" onclick="addCurrentDir()" data-tip="Add all to queue" style="display:none">
                <i class="fas fa-circle-plus"></i>
            </button>
            <button class="icon-btn" onclick="updateDB()" data-tip="Update database">
                <i class="fas fa-arrows-rotate"></i>
            </button>
        </div>
        <div class="scroll-list" id="library-list"></div>
    </div>

    <!-- Search tab -->
    <div id="tab-search" class="tab-content">
        <div class="search-box">
            <i class="fas fa-magnifying-glass"></i>
            <input type="text" id="searchInput"
                   placeholder="Search title, artist, album…"
                   oninput="handleSearch(this.value)">
            <button class="clear-btn" onclick="clearSearch()" data-tip="Clear">
                <i class="fas fa-xmark"></i>
            </button>
        </div>
        <div class="scroll-list" id="search-list">
            <div class="empty-msg"><i class="fas fa-magnifying-glass"></i><br>Type to search</div>
        </div>
    </div>
</aside>

<!-- ─── Main content ─────────────────────────────────────────────── -->
<main class="main-content">

    <!-- Full-bleed background art -->
    <div class="bg-art"     id="bg-art"></div>
    <div class="bg-overlay" id="bg-overlay"></div>

    <!-- Error banner -->
    <div id="error-banner" class="error-banner" style="display:none">
        <i class="fas fa-triangle-exclamation"></i>
        <span id="error-msg">Cannot reach MPD</span>
        <button onclick="document.getElementById('error-banner').style.display='none'">
            <i class="fas fa-xmark"></i>
        </button>
    </div>

    <!-- Now Playing -->
    <section class="now-playing">

        <!-- Vinyl disc -->
        <div class="vinyl-wrap">
            <!-- Visualizer canvas — rendered behind the disc (z-index 0) -->
            <canvas id="viz-canvas"></canvas>

            <!-- Disc — z-index 1 -->
            <div class="vinyl" id="vinyl-disc">
                <!-- Cover art circle -->
                <div class="vinyl-art" id="vinyl-art">
                    <img id="vinyl-img" alt="" style="display:none"
                         onerror="this.style.display='none';
                                  document.getElementById('vinyl-placeholder').style.display='flex'">
                    <div class="art-placeholder" id="vinyl-placeholder">
                        <i class="fas fa-music"></i>
                    </div>
                    <!-- Spindle inside art circle — hidden until art loads -->
                    <div class="vinyl-hole" id="vinyl-hole" style="display:none"></div>
                </div>
            </div>

            <!-- Tonearm — AFTER disc in DOM = z-index 2 = on top of disc -->
            <div class="tonearm">
                <svg viewBox="0 0 60 160" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <circle cx="48" cy="12" r="8" fill="#2a2a2a" stroke="#444" stroke-width="1.5"/>
                    <circle cx="48" cy="12" r="3" fill="#555"/>
                    <line x1="48" y1="20" x2="12" y2="148"
                          stroke="#3a3a3a" stroke-width="3" stroke-linecap="round"/>
                    <rect x="5" y="144" width="14" height="5" rx="2"
                          fill="#2a2a2a" stroke="#444" stroke-width="1"/>
                    <line x1="12" y1="149" x2="12" y2="156"
                          stroke="#555" stroke-width="1.5" stroke-linecap="round"/>
                </svg>
            </div>
        </div>

        <!-- Track info -->
        <div class="np-meta">
            <div class="np-title"  id="np-title">Nothing playing</div>
            <div class="np-artist" id="np-artist">—</div>
            <div class="np-album"  id="np-album"></div>
        </div>
    </section>

    <!-- Player bar -->
    <div class="player-bar">
        <!-- Frequency bar visualizer canvas — z-index 0, behind all controls -->
        <canvas id="bar-canvas"></canvas>
        <div class="seek-row">
            <span class="time-label" id="elapsed-time">0:00</span>
            <div class="seek-track" id="seek-track">
                <div class="seek-fill"  id="seek-fill"></div>
                <div class="seek-thumb" id="seek-thumb"></div>
            </div>
            <span class="time-label" id="duration-time">0:00</span>
        </div>

        <div class="ctrl-row">
            <div class="side-btns">
                <button class="ctrl-btn toggle-btn" id="btn-random" onclick="sendCtrl('toggle_random')" data-tip="Shuffle">
                    <i class="fas fa-shuffle"></i>
                </button>
                <button class="ctrl-btn toggle-btn" id="btn-repeat" onclick="sendCtrl('toggle_repeat')" data-tip="Repeat">
                    <i class="fas fa-repeat"></i>
                </button>
                <button class="ctrl-btn toggle-btn" id="btn-single" onclick="sendCtrl('toggle_single')" data-tip="Single">
                    <span class="btn-label-text">1</span>
                </button>
            </div>

            <div class="transport">
                <button class="ctrl-btn nav-btn" onclick="sendCtrl('previous')" data-tip="Previous">
                    <i class="fas fa-backward-step"></i>
                </button>
                <button class="ctrl-btn play-btn" id="btn-play" onclick="handlePlayPause()" data-tip="Play / Pause">
                    <i class="fas fa-play" id="play-icon"></i>
                </button>
                <button class="ctrl-btn nav-btn" onclick="sendCtrl('next')" data-tip="Next">
                    <i class="fas fa-forward-step"></i>
                </button>
            </div>

            <div class="side-btns volume-side">
                <i class="fas fa-volume-low vol-icon" id="vol-icon" onclick="toggleMute()" data-tip="Mute"></i>
                <input type="range" class="vol-slider" id="vol-slider"
                       min="0" max="100" value="100"
                       oninput="onVolumeInput(this.value)">
                <span class="vol-value" id="vol-value">100</span>
            </div>
        </div>
    </div>

</main>

<script src="js/script.js"></script>

<!-- ─── Settings panel ────────────────────────────────────────────── -->
<div class="settings-backdrop" id="settings-backdrop" onclick="closeSettings()"></div>

<div class="settings-panel" id="settings-panel">
    <div class="settings-header">
        <span><i class="fas fa-gear"></i> Settings</span>
        <button class="icon-btn" onclick="closeSettings()" data-tip="Close">
            <i class="fas fa-xmark"></i>
        </button>
    </div>

    <div class="settings-body">

        <!-- Connection -->
        <div class="settings-section">
            <h3>Connection</h3>
            <div class="settings-field">
                <label>MPD host</label>
                <input type="text" id="s-mpd-host" placeholder="localhost">
            </div>
            <div class="settings-field">
                <label>MPD port</label>
                <input type="number" id="s-mpd-port" placeholder="6600" min="1" max="65535">
            </div>
            <div class="settings-field">
                <label>Music directory</label>
                <input type="text" id="s-music-dir" placeholder="~/Music">
            </div>
            <div class="settings-actions">
                <button class="btn-secondary" onclick="testConn()">
                    <i class="fas fa-plug"></i> Test
                </button>
                <button class="btn-primary" onclick="saveConn()">
                    <i class="fas fa-floppy-disk"></i> Save
                </button>
            </div>
            <div class="conn-status" id="conn-status"></div>
        </div>

        <!-- Playback -->
        <div class="settings-section">
            <h3>Playback</h3>
            <div class="settings-row">
                <label>Pause on close</label>
                <button class="toggle-switch" id="tog-pause-close"
                        onclick="toggleSetting('player.pauseOnClose', this)"></button>
            </div>
        </div>

        <!-- Appearance -->
        <div class="settings-section">
            <h3>Appearance</h3>
            <div class="settings-field">
                <label>Accent colour</label>
                <input type="color" id="s-accent" value="#7c3aed"
                       oninput="previewAccent(this.value)"
                       onchange="saveSetting('ui.accentColor', this.value)">
            </div>
            <div class="settings-field">
                <label>Vinyl speed</label>
                <div class="slider-row">
                    <input type="range" id="s-vinyl-speed" min="2" max="20" step="1" value="6"
                           oninput="previewVinylSpeed(this.value)"
                           onchange="saveSetting('ui.vinylSpeed', this.value)">
                    <span id="s-vinyl-speed-val">6 s/rev</span>
                </div>
            </div>
            <div class="settings-field">
                <label>Background blur opacity</label>
                <div class="slider-row">
                    <input type="range" id="s-bg-opacity" min="0" max="40" step="5" value="18"
                           oninput="previewBgOpacity(this.value)"
                           onchange="saveSetting('ui.bgOpacity', (this.value/100).toFixed(2))">
                    <span id="s-bg-opacity-val">18 %</span>
                </div>
            </div>
        </div>

        <!-- Visualizer -->
        <div class="settings-section">
            <h3>Visualizer</h3>
            <div class="settings-field">
                <label>Mode</label>
                <div class="viz-mode-btns" id="viz-mode-btns">
                    <button class="viz-mode-btn active" data-mode="ellipse" onclick="setVizMode('ellipse')">
                        <i class="fas fa-circle-notch"></i> Ellipse
                    </button>
                    <button class="viz-mode-btn" data-mode="bar" onclick="setVizMode('bar')">
                        <i class="fas fa-chart-simple"></i> Bar
                    </button>
                    <button class="viz-mode-btn" data-mode="off" onclick="setVizMode('off')">
                        <i class="fas fa-ban"></i> Off
                    </button>
                </div>
            </div>
            <div class="settings-field">
                <label>MPD stream URL <span style="color:var(--text-dim);font-size:10px">(optional — for real FFT)</span></label>
                <input type="text" id="s-stream-url" placeholder="http://localhost:8000"
                       onchange="saveStreamUrl(this.value)">
            </div>
        </div>

    </div>
</div>

</body>
</html>
