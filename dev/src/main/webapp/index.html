<!DOCTYPE html>
<html lang="fr,en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>webPlayer</title>

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<!-- Sidebar -->
<div class="sidebar">
    <div class="sidebar-header">
        <div class="brand">
            <i class="fa-brands fa-youtube" style="color: red;"></i> WebPlaylist
        </div>
        <div class="search-container">
            <i class="fas fa-search"></i>
            <input type="text" id="searchInput" placeholder="Search library..." onkeyup="handleSearch()">
        </div>
    </div>

    <div class="playlist-container">
        <div id="playlist-ui">
            <!-- Songs injected here via JS -->
        </div>
    </div>

    <div class="sidebar-footer">
        <button class="add-btn" onclick="openModal()">
            <i class="fas fa-plus"></i> Add Music
        </button>
    </div>
</div>

<!-- Main  -->
<div class="main-content">
    <div class="video-wrapper">
        <div id="yt-player"></div>
    </div>
</div>

<!-- Add Modal -->
<div id="addModal" class="modal-overlay">
    <div class="modal-box">
        <h3>Import Music</h3>
        <p>Paste a YouTube Video or Playlist URL to add it to your library.</p>

        <input type="text" id="inputUrl" class="modal-input" placeholder="https://www.youtube.com/watch?v=...">

        <div class="modal-actions">
            <button id="submitBtn" onclick="submitSong()" class="btn-primary">Auto-Import</button>
            <button onclick="closeModal()" class="btn-secondary">Cancel</button>
        </div>
    </div>
</div>

<script src="/js/script.js"></script>

</body>
</html>
